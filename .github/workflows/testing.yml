  build-test-wheel:
    name: Python ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        #os: ['ubuntu-latest', 'macos-latest', 'windows-2022']
        os: ['ubuntu-latest']

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python[0] }}

    - name: Install Conan (needed to force m4 recipe)
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install conan
        conan list "m4/1.4.19#*" -r=conancenter
        conan download "m4/1.4.19#b38ced39a01e31fef5435bc634461fd2" -r=conancenter || \
        conan install "m4/1.4.19#b38ced39a01e31fef5435bc634461fd2" -r=conancenter --build=missing

    - name: Build wheels
      uses: pypa/cibuildwheel@v3.3.1
      with:
        extras: "uv"

    - name: Upload wheels
      uses: actions/upload-artifact@v6
      with:
        name: wheels-${{ matrix.os }}
        path: wheelhouse/*.whl

    - name: Diagnose PATH and m4 (the original UNIX one)
      if: ${{ always() && runner.os != 'Windows' }}
      shell: bash
      run: |
        echo "PATH=$PATH"
        echo "which m4:"; which m4 || true
        echo "m4 --version:"; m4 --version 2>&1 || true
        M4=$(which m4 || true)
        if [ -n "$M4" ]; then
          echo "ls -l $M4"; ls -l "$M4" || true
          echo "file $M4"; file "$M4" || true
          if command -v ldd >/dev/null 2>&1; then echo "ldd $M4"; ldd "$M4" || true; fi
        fi

    - name: Diagnose PATH and m4 (Unix - python)
      if: ${{ always() && runner.os != 'Windows' }}
      shell: bash
      run: |
        echo "PATH=$PATH"
        echo "which m4:"; which m4 || true
        sudo chmod a+rx /root/.conan2/p/m45ae2df3e318db/p/bin/m4
        echo "/root/.conan2/p/m45ae2df3e318db/p/bin/m4 --version:"; sudo /root/.conan2/p/m45ae2df3e318db/p/bin/m4  --version 2>&1 || true
        sudo echo "file $M4"; file /root/.conan2/p/m45ae2df3e318db/p/bin/m4 || true
        
        

    - name: Diagnose PATH and m4 (Windows)
      if: ${{ always() && runner.os == 'Windows' }}
      shell: pwsh
      run: |
        Write-Host "Path=$env:Path"
        Write-Host "Get-Command m4 -ErrorAction SilentlyContinue:"; Get-Command m4 -ErrorAction SilentlyContinue
        try { & m4 --version } catch { Write-Host "m4 not found or failed: $_" }

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-test-wheel]

    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')

    steps:
      - name: Get wheels
        uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.13.0
        with:
          password: ${{ secrets.PYPI_TOKEN_RESDATA }}
          skip-existing: true
