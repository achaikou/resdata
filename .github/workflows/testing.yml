  build-test-wheel:
    name: Python ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        #os: ['ubuntu-latest', 'macos-latest', 'windows-2022']
        os: ['ubuntu-latest']

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python[0] }}

    - name: Install Conan (needed to force m4 recipe)
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install conan
        conan list "m4/1.4.19#*" -r=conancenter

    - name: Try building m4 from CCI at known-good commit (non-fatal)
      shell: bash
      continue-on-error: true
      run: |
        set -x
        git clone https://github.com/conan-io/conan-center-index.git cci || true
        cd cci || exit 0
        # checkout the commit you pointed at (non-fatal)
        git fetch --depth=1 origin 67d4e9fd894603c23f380f30d4a71c963ea33fb8 || true
        git checkout 67d4e9fd894603c23f380f30d4a71c963ea33fb8 || git checkout --detach 67d4e9fd894603c23f380f30d4a71c963ea33fb8 || true
        cd recipes/m4/all || exit 0
        # Try to export/create the recipe into the local cache so Conan will prefer it
        # Commands are non-fatal and may vary between Conan 1.x and 2.x
        conan export . local/stable || true
        conan create . m4/1.4.19@local/stable --build=missing || true
        cd -
        ls -la cci/recipes/m4/all || true

    - name: Inspect Conan-generated envs and activate scripts (always, non-fatal)
      if: ${{ always() && runner.os != 'Windows' }}
      continue-on-error: true
      shell: bash
      run: |
        set -x
        # show Conan version and remotes
        conan --version || true
        conan remote list || true

        # create a tiny consumer workspace to force generation of env files
        rm -rf ci_consumer || true
        mkdir ci_consumer && cd ci_consumer
        cat > conanfile.txt <<'EOF'
        [requires]
        m4/1.4.19
        EOF

        # Install and generate envs (works for Conan v1 and v2; non-fatal)
        conan install . --install-folder=ci --build=missing || true
        conan generate . -if=ci -g VirtualBuildEnv -g VirtualRunEnv || true
        # legacy virtualenv generator (Conan v1)
        conan install . -g virtualenv -if=ci || true

        echo "=== ci dir listing ==="
        find ci -maxdepth 3 -print -type f -name 'activate*' -o -name '*.env' -o -name 'conaninfo.txt' || true
        # print any activate scripts or env sh files
        for f in ci/activate* ci/activate_run* ci/activate_build* ci/*.env ci/*/activate*; do
          [ -f "$f" ] || continue
          echo "---- $f ----"
          head -n 200 "$f" || true
        done

        # Inspect conan cache for package bin dirs that might be prepended to build/run envs
        echo "--- Conan user home ---"
        echo "${CONAN_USER_HOME:-$HOME/.conan2}"
        find "${CONAN_USER_HOME:-$HOME/.conan2}" -path "*/m4/*/package/*/bin" -type d -print -exec ls -la {} \; 2>/dev/null || true

        cd ..
        rm -rf ci_consumer || true

    - name: Build wheels
      uses: pypa/cibuildwheel@v3.3.1
      with:
        extras: "uv"

    - name: Upload wheels
      uses: actions/upload-artifact@v6
      with:
        name: wheels-${{ matrix.os }}
        path: wheelhouse/*.whl

    - name: Diagnose PATH and m4 (the original UNIX one)
      if: ${{ always() && runner.os != 'Windows' }}
      shell: bash
      run: |
        echo "PATH=$PATH"
        echo "which m4:"; which m4 || true
        echo "m4 --version:"; m4 --version 2>&1 || true
        M4=$(which m4 || true)
        if [ -n "$M4" ]; then
          echo "ls -l $M4"; ls -l "$M4" || true
          echo "file $M4"; file "$M4" || true
          if command -v ldd >/dev/null 2>&1; then echo "ldd $M4"; ldd "$M4" || true; fi
        fi

    - name: Diagnose PATH and m4 (Unix - python)
      if: ${{ always() && runner.os != 'Windows' }}
      shell: bash
      run: |
        echo "PATH=$PATH"
        echo "which m4:"; which m4 || true
        sudo echo "/root/.conan2/p/m45ae2df3e318db/p/bin/m4 --version:"; /root/.conan2/p/m45ae2df3e318db/p/bin/m4  --version 2>&1 || true
        sudo echo "file $M4"; file /root/.conan2/p/m45ae2df3e318db/p/bin/m4 || true
        

    - name: Inspect Conan env & cache (always, non-fatal)
      if: ${{ always() && runner.os != 'Windows' }}
      continue-on-error: true
      shell: bash
      run: |
        set -x
        conan --version || true
        conan remote list || true
        echo "HOME=$HOME"
        echo "CONAN_USER_HOME=${CONAN_USER_HOME:-$HOME/.conan2}"
        echo "PATH=$PATH"
        echo "which m4:"; which m4 || true
        echo "m4 --version:"; m4 --version 2>&1 || true

        echo "--- list candidate Conan package bin dirs (may include m4) ---"
        find "${CONAN_USER_HOME:-$HOME/.conan2}" -type d -name bin -maxdepth 6 -print 2>/dev/null || true

        echo "--- list m4-related packages in Conan cache ---"
        find "${CONAN_USER_HOME:-$HOME/.conan2}" -path "*/m4/*" -print -maxdepth 6 2>/dev/null || true
        echo "--- ls package bin dirs for m4 if present ---"
        find "${CONAN_USER_HOME:-$HOME/.conan2}" -path "*/m4/*/package/*/bin" -type d -print -exec ls -la {} \; 2>/dev/null || true

        echo "--- look for generated activate scripts / env files ---"
        find . -maxdepth 4 -type f -name 'activate*' -print -exec head -n 30 {} \; 2>/dev/null || true
        find "${CONAN_USER_HOME:-$HOME/.conan2}" -type f -name 'activate*' -print -exec head -n 10 {} \; 2>/dev/null || true
        

    - name: Diagnose PATH and m4 (Windows)
      if: ${{ always() && runner.os == 'Windows' }}
      shell: pwsh
      run: |
        Write-Host "Path=$env:Path"
        Write-Host "Get-Command m4 -ErrorAction SilentlyContinue:"; Get-Command m4 -ErrorAction SilentlyContinue
        try { & m4 --version } catch { Write-Host "m4 not found or failed: $_" }

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-test-wheel]

    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')

    steps:
      - name: Get wheels
        uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.13.0
        with:
          password: ${{ secrets.PYPI_TOKEN_RESDATA }}
          skip-existing: true
