[build-system]
requires = [
  "cmake<4",
  "conan>=2",
  "ninja",
  "scikit-build",
  "setuptools",
  "setuptools_scm",
  "wheel",
]

[dependency-groups]
test = [
  "pytest",
  "pytest-benchmark",
  "pytest-timeout",
  "hypothesis",
  "pydantic",
  "typing_extensions",
  "resfo-utilities[testing]>=0.4.0",
  "numpy",
  "pandas",
]
types = ["mypy", "types-six"]
format = ["cmake-format", "clang-format", "black"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]

[tool.cibuildwheel]
build-frontend = "build[uv]"
build = "cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_*"

[tool.cibuildwheel.linux]
before-all =  "yum install -y zlib-devel"
before-build = """
python -m pip install --upgrade pip
python -m pip install conan
conan list "m4/1.4.19#*" -r=conancenter
conan download "m4/1.4.19#b38ced39a01e31fef5435bc634461fd2" -r=conancenter || conan install "m4/1.4.19#b38ced39a01e31fef5435bc634461fd2" -r=conancenter --build=missing
rm -rf {package}/_skbuild
"""
test-groups = ["test"]
test-command = "pytest {package}/tests"

[tool.cibuildwheel.macos]
before-all = "brew install zlib"
before-build = "rm -rf {package}/_skbuild"
test-groups = ["test"]
test-command = "pytest {package}/tests"
